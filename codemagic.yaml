workflows:
  ios-simhub:
    name: SimHub iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SimHub.xcodeproj"
        XCODE_SCHEME: "SimHub"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          xcodegen generate

      - name: Archive without code signing
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SimHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package as unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/SimHub.xcarchive/Products/Applications/SimHub.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r SimHub.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
